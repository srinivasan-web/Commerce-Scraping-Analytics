services:
  - type: web
    name: commerce-scraping-analytics-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium
    startCommand: PLAYWRIGHT_BROWSERS_PATH=0 uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: SCRAPER_MAX_WORKERS
        value: "1"
      - key: SCRAPER_MAX_BROWSERS
        value: "1"
      - key: SCRAPER_KEEP_BROWSER_POOL
        value: "0"
      - key: DATABASE_POOL_SIZE
        value: "2"
      - key: SCRAPER_MAX_DETAIL_CONCURRENCY
        value: "2"
      - key: SCRAPER_MAX_VARIANT_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: commerce-scraping-analytics-db
          property: connectionString
      - key: CORS_ORIGIN_REGEX
        value: "https://commerce-scraping-analytics(?:-[a-z0-9]+)?(?:-git-main)?-srinivasan-webs-projects\\.vercel\\.app"

databases:
  - name: commerce-scraping-analytics-db
    plan: free
    databaseName: commerce_scraping_analytics
    user: commerce_scraper
